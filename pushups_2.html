<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pushups</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050608;
    --bg-glow: radial-gradient(120% 70% at 50% -10%, #10141b 0%, #050608 55%);
    --panel: #0d1015;
    --panel-hi: #131720;
    --border: rgba(255,255,255,0.07);
    --border-hi: rgba(186,255,61,0.22);
    --text: #eef2f5;
    --muted: #6b7280;
    --muted-dim: #454b56;
    --lime: #baff3d;
    --lime-dim: #7fb300;
    --cyan: #35e8ff;
    --amber: #ff9f4d;
    --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --shadow: 0 10px 36px rgba(0,0,0,0.5);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: var(--sans);
    background: var(--bg-glow), var(--bg);
    background-attachment: fixed;
    color: var(--text);
    min-height: 100%;
    display: flex;
    justify-content: center;
    padding-bottom: env(safe-area-inset-bottom);
    position: relative;
  }
  /* faint HUD grid */
  body::before {
    content: "";
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 28px 28px;
    mask-image: radial-gradient(80% 60% at 50% 15%, #000 0%, transparent 75%);
  }
  .app {
    width: 100%;
    max-width: 440px;
    min-height: 100vh;
    padding: 26px 20px 106px;
    position: relative;
    z-index: 1;
  }

  /* Header */
  header { margin-bottom: 26px; display: flex; align-items: flex-start; justify-content: space-between; }
  .greeting {
    color: var(--lime); font-size: 0.72em; font-weight: 600; font-family: var(--mono);
    text-transform: uppercase; letter-spacing: 0.14em; display: flex; align-items: center; gap: 6px;
  }
  .greeting::before { content: ">"; opacity: 0.7; }
  .caret {
    display: inline-block; width: 7px; height: 13px; background: var(--lime);
    animation: blink 1.1s step-end infinite; margin-left: 1px; box-shadow: 0 0 8px rgba(186,255,61,0.6);
  }
  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  .date-big { font-size: 1.32em; font-weight: 700; letter-spacing: -0.02em; margin-top: 6px; }
  .flame {
    display: flex; align-items: center; gap: 7px;
    background: var(--panel); border: 1px solid var(--border);
    padding: 9px 14px; border-radius: 10px; font-weight: 700; font-size: 0.92em;
    font-family: var(--mono); box-shadow: var(--shadow); flex-shrink: 0;
  }
  .flame .fire { font-size: 1.05em; filter: saturate(1.4) drop-shadow(0 0 6px rgba(255,159,77,0.5)); }
  .flame span#flameNum { color: var(--amber); }

  .panel { display: none; animation: fade 0.32s ease; }
  .panel.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  /* Ring */
  .ring-wrap {
    display: flex; flex-direction: column; align-items: center;
    padding: 14px 0 6px; position: relative;
  }
  .ring { position: relative; width: 252px; height: 252px; }
  .ring svg { transform: rotate(-90deg); overflow: visible; }
  .tick { stroke: rgba(255,255,255,0.09); }
  .tick.major { stroke: rgba(255,255,255,0.18); }
  .ring-center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .ring-eyebrow {
    font-family: var(--mono); font-size: 0.68em; color: var(--muted); letter-spacing: 0.22em;
    text-transform: uppercase; margin-bottom: 6px;
  }
  .ring-num {
    font-family: var(--mono); font-size: 3.9em; font-weight: 700; line-height: 1; letter-spacing: -0.03em;
    text-shadow: 0 0 26px rgba(186,255,61,0.22);
  }
  .ring-goal {
    color: var(--muted); font-size: 0.85em; margin-top: 10px; font-weight: 500; cursor: pointer;
    font-family: var(--mono); border: 1px solid var(--border); padding: 4px 11px; border-radius: 999px;
    transition: border-color 0.2s, color 0.2s;
  }
  .ring-goal:active { color: var(--lime); border-color: var(--border-hi); }
  .ring-goal-input {
    color: var(--lime); font-size: 0.85em; margin-top: 10px; font-weight: 700;
    font-family: var(--mono); border: 1px solid var(--border-hi); padding: 4px 11px; border-radius: 999px;
    background: var(--panel-hi); text-align: center; width: 90px; outline: none;
  }
  .ring-label {
    color: var(--muted-dim); font-size: 0.7em; text-transform: uppercase; letter-spacing: 0.18em; margin-top: 10px;
    font-family: var(--mono);
  }
  .done-badge {
    margin-top: 10px; color: var(--bg); font-weight: 700; font-size: 0.78em;
    opacity: 0; transition: opacity 0.3s; font-family: var(--mono); letter-spacing: 0.06em;
    background: var(--lime); padding: 5px 12px; border-radius: 999px;
    box-shadow: 0 0 18px rgba(186,255,61,0.4);
  }
  .done-badge.show { opacity: 1; }

  /* Controls */
  .controls {
    display: flex; gap: 20px; justify-content: center; align-items: center;
    margin-top: 26px;
  }
  .btn-round {
    width: 62px; height: 62px; border-radius: 16px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); font-size: 1.7em; font-weight: 300;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: transform 0.12s, background 0.2s, border-color 0.2s;
    font-family: var(--mono);
  }
  .btn-round:active { transform: scale(0.9); background: var(--panel-hi); }
  .btn-plus {
    width: 92px; height: 92px; font-size: 2.2em; color: #05130a; border: none; border-radius: 24px;
    background: linear-gradient(150deg, var(--lime), var(--lime-dim));
    box-shadow: 0 0 0 1px rgba(186,255,61,0.15), 0 8px 30px rgba(186,255,61,0.28);
    font-weight: 400; font-family: var(--sans);
  }
  .btn-plus:active { transform: scale(0.92); }

  .quick {
    display: flex; gap: 10px; justify-content: center; margin-top: 26px;
  }
  .quick button {
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    padding: 11px 21px; border-radius: 10px; cursor: pointer; font-size: 0.86em; font-weight: 700;
    transition: border-color 0.2s, background 0.2s, color 0.2s; font-family: var(--mono);
  }
  .quick button:active { background: var(--panel-hi); border-color: var(--border-hi); color: var(--lime); }
  .reset {
    display: block; margin: 24px auto 0; background: none; border: none; color: var(--muted-dim);
    cursor: pointer; font-size: 0.74em; font-family: var(--mono); letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .reset:active { color: var(--muted); }

  /* Stats */
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  .mini {
    background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 17px;
    box-shadow: var(--shadow); position: relative;
  }
  .mini::before {
    content: ""; position: absolute; top: 10px; right: 10px; width: 6px; height: 6px;
    border-radius: 50%; background: var(--lime); opacity: 0.55; box-shadow: 0 0 6px rgba(186,255,61,0.7);
  }
  .mini .l {
    color: var(--muted); font-size: 0.68em; margin-bottom: 8px; font-weight: 600;
    font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.1em;
  }
  .mini .n { font-size: 1.9em; font-weight: 800; letter-spacing: -0.03em; font-family: var(--mono); }

  .chart-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 18px;
    padding: 20px 16px 16px; box-shadow: var(--shadow); margin-bottom: 14px;
  }
  .chart-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; }
  .chart-head .t { font-weight: 700; font-size: 1em; font-family: var(--mono); }
  .chart-head .avg { color: var(--muted); font-size: 0.76em; font-weight: 500; margin-top: 3px; font-family: var(--mono); }
  .range-toggle { display: flex; gap: 3px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 3px; }
  .range-toggle button {
    border: none; background: none; color: var(--muted); font-weight: 700; font-size: 0.72em;
    padding: 7px 13px; border-radius: 7px; cursor: pointer; transition: all 0.2s; font-family: var(--mono);
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .range-toggle button.active { background: var(--lime); color: #05130a; }
  .chart { display: flex; align-items: flex-end; gap: 8px; height: 156px; position: relative; }
  .chart::before {
    content: ""; position: absolute; left: 0; right: 0; top: 0; bottom: 20px;
    background-image: repeating-linear-gradient(180deg, rgba(255,255,255,0.05) 0, rgba(255,255,255,0.05) 1px, transparent 1px, transparent 33.33%);
    pointer-events: none;
  }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 8px; position: relative; z-index: 1; }
  .bar-track { width: 100%; max-width: 32px; height: 100%; display: flex; align-items: flex-end; }
  .bar {
    width: 100%; border-radius: 6px 6px 3px 3px; min-height: 3px; position: relative;
    background: linear-gradient(180deg, var(--lime), var(--lime-dim));
    box-shadow: 0 0 12px rgba(186,255,61,0.25);
    animation: grow 0.5s cubic-bezier(0.34,1.56,0.64,1) backwards;
  }
  @keyframes grow { from { height: 0 !important; } }
  .bar.zero { background: var(--panel-hi); box-shadow: none; }
  .bar.today { background: linear-gradient(180deg, var(--cyan), #1c8fa8); box-shadow: 0 0 14px rgba(53,232,255,0.35); }
  .bar .val {
    position: absolute; top: -20px; left: 50%; transform: translateX(-50%);
    font-size: 0.68em; color: var(--text); font-weight: 700; white-space: nowrap; font-family: var(--mono);
  }
  .bar-label { font-size: 0.66em; color: var(--muted); font-weight: 600; font-family: var(--mono); }
  .bar-label.today { color: var(--cyan); }

  /* Bottom nav */
  .nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    display: flex; justify-content: center; gap: 8px;
    padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(0deg, var(--bg) 45%, transparent);
    z-index: 2;
  }
  .nav-inner {
    display: flex; gap: 5px; background: rgba(13,16,21,0.92); backdrop-filter: blur(20px);
    border: 1px solid var(--border-hi); border-radius: 14px; padding: 5px;
    box-shadow: var(--shadow);
  }
  .nav-btn {
    display: flex; align-items: center; gap: 8px; padding: 11px 24px; border-radius: 10px;
    cursor: pointer; color: var(--muted); font-weight: 700; font-size: 0.82em; border: none; background: none;
    transition: all 0.2s; font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.05em;
  }
  .nav-btn.active { background: var(--panel-hi); color: var(--lime); }
  .nav-btn .ic { font-size: 1.05em; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <div class="greeting" id="greeting">Let's move<span class="caret"></span></div>
      <div class="date-big" id="dateBig"></div>
    </div>
    <div class="flame"><span class="fire">🔥</span><span id="flameNum">0</span></div>
  </header>

  <!-- TODAY -->
  <div class="panel active" id="panel-today">
    <div class="ring-wrap">
      <div class="ring">
        <svg width="252" height="252" viewBox="0 0 252 252">
          <!-- tick marks -->
          <g id="ticks" stroke-width="2"></g>
          <circle cx="126" cy="126" r="104" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="14"/>
          <circle id="ringFill" cx="126" cy="126" r="104" fill="none" stroke="url(#g)" stroke-width="14"
                  stroke-linecap="round" stroke-dasharray="653.4" stroke-dashoffset="653.4"
                  style="transition: stroke-dashoffset 0.6s cubic-bezier(0.4,0,0.2,1);"/>
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#baff3d"/>
              <stop offset="100%" stop-color="#6fa300"/>
            </linearGradient>
          </defs>
        </svg>
        <div class="ring-center">
          <div class="ring-eyebrow">Reps</div>
          <div class="ring-num" id="count">0</div>
          <div class="ring-goal" id="goalEdit">GOAL <span id="goalTxt">50</span> ✎</div>
          <input class="ring-goal-input" id="goalInput" type="number" inputmode="numeric" min="1" style="display:none;"/>
          <div class="done-badge" id="doneBadge">✓ GOAL SMASHED</div>
        </div>
      </div>
      <div class="ring-label" id="ringLabelText">pushups today</div>
    </div>

    <div class="controls">
      <button class="btn-round" id="minus">−</button>
      <button class="btn-round btn-plus" id="plus">+</button>
    </div>
    <div class="quick">
      <button data-add="5">+5</button>
      <button data-add="10">+10</button>
      <button data-add="25">+25</button>
    </div>
    <button class="reset" id="reset">Reset today</button>
  </div>

  <!-- STATS -->
  <div class="panel" id="panel-stats">
    <div class="cards">
      <div class="mini"><div class="l">Total pushups</div><div class="n" id="statTotal">0</div></div>
      <div class="mini"><div class="l">Best day</div><div class="n" id="statBest">0</div></div>
      <div class="mini"><div class="l">Day streak</div><div class="n" id="statStreak">0</div></div>
      <div class="mini"><div class="l">This week</div><div class="n" id="statWeek">0</div></div>
    </div>
    <div class="chart-card">
      <div class="chart-head">
        <div><div class="t" id="chartTitle">Last 7 days</div><div class="avg" id="chartAvg">avg 0/day</div></div>
        <div class="range-toggle">
          <button class="active" data-range="week">Week</button>
          <button data-range="month">Month</button>
        </div>
      </div>
      <div class="chart" id="chart"></div>
    </div>
  </div>

  <!-- NAV -->
  <div class="nav">
    <div class="nav-inner">
      <button class="nav-btn active" data-tab="today"><span class="ic">🎯</span> Today</button>
      <button class="nav-btn" data-tab="stats"><span class="ic">📊</span> Stats</button>
    </div>
  </div>
</div>

<script>
const PREFIX = 'pushups_';
const CIRC = 2 * Math.PI * 104; // 653.4
let GOAL = parseInt(localStorage.getItem('pushups_goal') || '50', 10);
let RANGE = 'week';
function dayKey(d) { return d.toISOString().slice(0, 10); }
const today = dayKey(new Date());
const key = PREFIX + today;
const $ = id => document.getElementById(id);
function get(k) { return parseInt(localStorage.getItem(k) || '0', 10); }
function set(k, v) { localStorage.setItem(k, Math.max(0, v)); }

// Build radar tick marks around the ring
(function buildTicks() {
  const g = $('ticks');
  const cx = 126, cy = 126, rOuter = 118, rInner = 112, rInnerMajor = 108;
  let html = '';
  for (let i = 0; i < 60; i++) {
    const angle = (i / 60) * Math.PI * 2;
    const major = i % 5 === 0;
    const rIn = major ? rInnerMajor : rInner;
    const x1 = cx + rOuter * Math.cos(angle), y1 = cy + rOuter * Math.sin(angle);
    const x2 = cx + rIn * Math.cos(angle), y2 = cy + rIn * Math.sin(angle);
    html += `<line class="tick${major ? ' major' : ''}" x1="${x1.toFixed(2)}" y1="${y1.toFixed(2)}" x2="${x2.toFixed(2)}" y2="${y2.toFixed(2)}"/>`;
  }
  g.innerHTML = html;
})();

// Nav
document.querySelectorAll('.nav-btn').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('.nav-btn').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    $('panel-' + b.dataset.tab).classList.add('active');
    if (b.dataset.tab === 'stats') renderStats();
  };
});

// Today
function renderCount() {
  const n = get(key);
  $('count').textContent = n;
  $('goalTxt').textContent = GOAL;
  const pct = Math.min(1, n / GOAL);
  $('ringFill').style.strokeDashoffset = CIRC * (1 - pct);
  $('doneBadge').classList.toggle('show', n >= GOAL);
  $('flameNum').textContent = computeStreak(allDays());
}
$('plus').onclick = () => { set(key, get(key) + 1); renderCount(); };
$('minus').onclick = () => { set(key, get(key) - 1); renderCount(); };
document.querySelectorAll('.quick button').forEach(b => {
  b.onclick = () => { set(key, get(key) + parseInt(b.dataset.add, 10)); renderCount(); };
});
$('reset').onclick = () => { if (confirm('Reset today?')) { set(key, 0); renderCount(); } };
const goalInput = $('goalInput');
function openGoalEdit() {
  goalInput.value = GOAL;
  $('goalEdit').style.display = 'none';
  goalInput.style.display = 'inline-block';
  goalInput.focus();
  goalInput.select();
}
function closeGoalEdit(commit) {
  if (commit) {
    const n = parseInt(goalInput.value, 10);
    if (n > 0) { GOAL = n; localStorage.setItem('pushups_goal', n); }
  }
  goalInput.style.display = 'none';
  $('goalEdit').style.display = '';
  renderCount();
}
$('goalEdit').onclick = openGoalEdit;
goalInput.onblur = () => closeGoalEdit(true);
goalInput.onkeydown = (e) => {
  if (e.key === 'Enter') { e.preventDefault(); goalInput.blur(); }
  if (e.key === 'Escape') { e.preventDefault(); closeGoalEdit(false); }
};

// Data
function allDays() {
  const map = {};
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k.startsWith(PREFIX)) map[k.slice(PREFIX.length)] = get(k);
  }
  return map;
}
function computeStreak(map) {
  let streak = 0, d = new Date();
  if ((map[dayKey(d)] || 0) === 0) d.setDate(d.getDate() - 1);
  while ((map[dayKey(d)] || 0) > 0) { streak++; d.setDate(d.getDate() - 1); }
  return streak;
}
function renderStats() {
  const map = allDays();
  const vals = Object.values(map);
  $('statTotal').textContent = vals.reduce((a,b)=>a+b,0);
  $('statBest').textContent = vals.length ? Math.max(...vals) : 0;
  $('statStreak').textContent = computeStreak(map);

  // this-week total (last 7 days) always shown in stat card
  let weekTotal = 0;
  for (let i = 0; i < 7; i++) { const d = new Date(); d.setDate(d.getDate()-i); weekTotal += map[dayKey(d)] || 0; }
  $('statWeek').textContent = weekTotal;

  const bars = RANGE === 'week' ? weekBars(map) : monthBars(map);
  $('chartTitle').textContent = RANGE === 'week' ? 'Last 7 days' : 'Last 6 weeks';
  const total = bars.reduce((a,b)=>a+b.val,0);
  const unit = RANGE === 'week' ? '/day' : '/wk';
  $('chartAvg').textContent = 'avg ' + Math.round(total/bars.length) + unit;

  const max = Math.max(1, ...bars.map(b => b.val));
  $('chart').innerHTML = bars.map((d,i) => {
    const h = d.val === 0 ? 3 : Math.round((d.val / max) * 100);
    const cls = d.val === 0 ? 'zero' : (d.isNow ? 'today' : '');
    return `<div class="bar-col">
      <div class="bar-track">
        <div class="bar ${cls}" style="height:${h}%; animation-delay:${i*0.05}s">
          ${d.val > 0 ? `<span class="val">${d.val}</span>` : ''}
        </div>
      </div>
      <div class="bar-label ${d.isNow?'today':''}">${d.label}</div>
    </div>`;
  }).join('');
}
function weekBars(map) {
  const out = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const k = dayKey(d);
    out.push({ val: map[k] || 0, label: ['Su','Mo','Tu','We','Th','Fr','Sa'][d.getDay()], isNow: k === today });
  }
  return out;
}
function monthBars(map) {
  const out = [];
  for (let w = 5; w >= 0; w--) {
    let sum = 0;
    const start = new Date(); start.setDate(start.getDate() - (w*7 + 6));
    for (let j = 0; j < 7; j++) { const d = new Date(start); d.setDate(start.getDate()+j); sum += map[dayKey(d)] || 0; }
    out.push({ val: sum, label: (start.getMonth()+1) + '/' + start.getDate(), isNow: w === 0 });
  }
  return out;
}
document.querySelectorAll('.range-toggle button').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('.range-toggle button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    RANGE = b.dataset.range;
    renderStats();
  };
});

// Init
const h = new Date().getHours();
$('greeting').innerHTML = (h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening') + '<span class="caret"></span>';
$('dateBig').textContent = new Date().toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric' });
renderCount();
</script>
</body>
</html>
